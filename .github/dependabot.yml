version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # Keep TypeScript within typescript-eslint's supported range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
